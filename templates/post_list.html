<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post List</title>
</head>
<body>
    Welcome to the post list page!
    <h1><a href="{% url 'post_create' %}">Create Post</a></h1>
    {% for post in posts_summary %}
        <h2>{{ post.title }}</h2>
        <p>{{ post.content }}<b> <a href="{% url 'post-detail' pk=post.id %}">Read more</a></b>
        </p>
        
    {% endfor %}
</body>
</html>
